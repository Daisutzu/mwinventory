name: Scrape MediaWorld prices

on:
  schedule:
    # GitHub Actions accetta solo cron in UTC, senza fuso orario: le 04:00 UTC
    # sono le 06:00 in Italia con l'ora legale (CEST, marzo-ottobre) e le
    # 05:00 con l'ora solare (CET, resto dell'anno) - un'ora di scarto in
    # inverno e' irrilevante per un controllo prezzi giornaliero.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Run price scraper
        run: python scripts/scrape_prices.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
