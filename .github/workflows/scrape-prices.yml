name: Scrape MediaWorld prices

on:
  # Niente "schedule": mediaworld.it risponde 403 a ogni richiesta che arriva
  # dagli IP dei runner ospitati da GitHub (blocco anti-bot sul traffico da
  # datacenter/cloud), quindi un cron qui girerebbe "con successo" senza mai
  # aggiornare un prezzo. Lo scraping vero adesso gira ogni notte alle 6:00
  # da un'attivita' pianificata sul PC del negozio (stesso script, stesso
  # service account, ma da un IP normale che MediaWorld non blocca). Questo
  # workflow resta solo come strumento manuale per riverificare il blocco
  # in futuro.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Run price scraper
        run: python scripts/scrape_prices.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
